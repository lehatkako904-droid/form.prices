<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>چوونەژوورەوەی بەڕێوەبەر</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-blue-900 mb-6">چوونەژوورەوەی داشبۆردی بەڕێوەبەر</h2>
        {% if error %}
        <div class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm">{{ error }}</div>
        {% endif %}
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-gray-700 mb-1">ناوی بەکارهێنەر</label>
                <input type="text" name="username" required class="w-full border rounded-lg p-2.5 outline-none">
            </div>
            <div>
                <label class="block text-gray-700 mb-1">وشەی تێپەڕ (Password)</label>
                <input type="password" name="password" required class="w-full border rounded-lg p-2.5 outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-900 text-white py-3 rounded-lg font-bold hover:bg-blue-800 transition">چوونەژوورەوە</button>
        </form>
        <div class="text-center mt-4">
            <a href="{{ url_for('index') }}" class="text-sm text-blue-600 hover:underline">گەڕانەوە بۆ پەڕەی سەرەکی</a>
        </div>
    </div>
</body>
</html>
