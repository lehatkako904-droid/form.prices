<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تۆمارکردنی فرۆشگا</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-lg">
        <h2 class="text-2xl font-bold text-center text-blue-900 mb-6">فۆرمی خۆتۆمارکردنی پێشانگا و کۆمپانیا</h2>
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-gray-700 mb-1">ناوی فرۆشگا / پێشانگا / کۆمپانیا</label>
                <input type="text" name="name" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-gray-700 mb-1">ژمارەی پەیوەندی</label>
                <input type="text" name="phone" required class="w-full border rounded-lg p-2.5 outline-none">
            </div>
            <div>
                <label class="block text-gray-700 mb-1">ئیمەیڵ</label>
                <input type="email" name="email" required class="w-full border rounded-lg p-2.5 outline-none">
            </div>
            <div>
                <label class="block text-gray-700 mb-1">کەتەگۆری کاڵا</label>
                <select name="category" class="w-full border rounded-lg p-2.5 outline-none">
                    <option value="ئەلکترۆنیات">ئەلکترۆنیات</option>
                    <option value="کارەباییات">کارەباییات</option>
                    <option value="بیناسازی">بیناسازی</option>
                    <option value="کەلوپەل">کەلوپەل</option>
                </select>
            </div>
            <div>
                <label class="block text-gray-700 mb-1">ناونیشان</label>
                <textarea name="address" class="w-full border rounded-lg p-2.5 outline-none"></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-900 text-white py-3 rounded-lg font-bold hover:bg-blue-800 transition">تۆمارکردن</button>
        </form>
        <div class="text-center mt-4">
            <a href="{{ url_for('index') }}" class="text-sm text-blue-600 hover:underline">گەڕانەوە بۆ پەڕەی سەرەکی</a>
        </div>
    </div>
</body>
</html>
