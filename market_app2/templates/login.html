{% extends "base.html" %}
{% block title %}چوونە ژوورەوە - بازاڕی کوردستان{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h2>چوونە ژوورەوەی فرۆشگا</h2>
    <form method="post" action="{{ url_for('login') }}">
      <label>ناوی بەکارهێنەر</label>
      <input type="text" name="username" required autocomplete="username">

      <label>پاسورد</label>
      <input type="password" name="password" required autocomplete="current-password">

      <button type="submit" class="btn btn-primary btn-block">چوونە ژوورەوە</button>
    </form>
    <p class="muted center">هیچ هەژمارێکت نییە؟ <a href="{{ url_for('register') }}">تۆمار بکە</a></p>
  </div>
</div>
{% endblock %}
