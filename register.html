{% extends "base.html" %}
{% block title %}تۆمارکردن - بازاڕی کوردستان{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <h2>تۆمارکردنی فرۆشگا</h2>
    <p class="muted">هەژمارێک دروست بکە بۆ بەڕێوەبردنی نرخی کاڵاکانت.</p>

    <form method="post" action="{{ url_for('register') }}">
      <div class="form-section">
        <h4>زانیاری چوونە ژوورەوە</h4>
        <label>ناوی بەکارهێنەر <span class="req">*</span></label>
        <input type="text" name="username" required autocomplete="username">

        <label>پاسورد <span class="req">*</span></label>
        <input type="password" name="password" required minlength="4" autocomplete="new-password">

        <label>دووبارەکردنەوەی پاسورد <span class="req">*</span></label>
        <input type="password" name="confirm" required minlength="4" autocomplete="new-password">
      </div>

      <div class="form-section">
        <h4>زانیاری فرۆشگا</h4>
        <label>ناوی فرۆشگا <span class="req">*</span></label>
        <input type="text" name="shop_name" required>

        <label>ناوی پێشانگا</label>
        <input type="text" name="showroom">

        <label>ناوی کۆمپانیا</label>
        <input type="text" name="company">

        <label>ژمارەی پەیوەندی</label>
        <input type="text" name="phone" dir="ltr">

        <label>ئیمەیل</label>
        <input type="email" name="email" dir="ltr">

        <label>کتێگۆری کاڵاکان</label>
        <select name="category">
          <option value="">- هەڵبژێرە -</option>
          {% for value, label in categories %}
          <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <button type="submit" class="btn btn-primary btn-block">تۆمارکردن</button>
    </form>

    <p class="muted center">هەژمارت هەیە؟ <a href="{{ url_for('login') }}">بچۆ ژوورەوە</a></p>
  </div>
</div>
{% endblock %}
